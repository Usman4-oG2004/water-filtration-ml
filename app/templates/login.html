<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Water Filtration ML Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b0f19; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-gray-100">

  <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-xl p-8 shadow-2xl">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-2 text-sky-400 font-extrabold text-xl tracking-tight mb-2">
        <span class="w-3 h-3 bg-emerald-500 rounded-full shadow-lg shadow-emerald-500/50 animate-pulse"></span>
        <span>Water Filtration ML Platform</span>
      </div>
      <p class="text-gray-400 text-sm">Access your predictive optimization workspace</p>
    </div>

    <!-- Error Alert -->
    {% if error %}
    <div class="mb-6 bg-red-950/40 border border-red-800 text-red-400 p-3 rounded-lg text-sm flex items-center gap-2">
      <span>⚠</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- Forms Tabs -->
    <div class="flex border-b border-gray-800 mb-6">
      <button id="tab-login" class="flex-1 pb-3 text-sm font-semibold text-sky-400 border-b-2 border-sky-400 focus:outline-none">Sign In</button>
      <button id="tab-register" class="flex-1 pb-3 text-sm font-semibold text-gray-400 border-b-2 border-transparent hover:text-gray-200 focus:outline-none">Register</button>
    </div>

    <!-- Login Form -->
    <form id="form-login" action="/login" method="POST" class="space-y-4">
      <div>
        <label for="login-username" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Username</label>
        <input type="text" id="login-username" name="username" required 
               class="w-full bg-gray-950 border border-gray-800 focus:border-sky-500 text-white rounded-lg p-3 text-sm outline-none transition-colors">
      </div>
      <div>
        <label for="login-password" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Password</label>
        <input type="password" id="login-password" name="password" required 
               class="w-full bg-gray-950 border border-gray-800 focus:border-sky-500 text-white rounded-lg p-3 text-sm outline-none transition-colors">
      </div>
      <button type="submit" 
              class="w-full bg-sky-500 hover:bg-sky-600 text-gray-950 font-bold p-3 rounded-lg text-sm transition-colors mt-2">
        Sign In
      </button>
    </form>

    <!-- Register Form -->
    <form id="form-register" action="/register" method="POST" class="space-y-4 hidden">
      <div>
        <label for="reg-username" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Username</label>
        <input type="text" id="reg-username" name="username" required 
               class="w-full bg-gray-950 border border-gray-800 focus:border-sky-500 text-white rounded-lg p-3 text-sm outline-none transition-colors">
      </div>
      <div>
        <label for="reg-password" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Password</label>
        <input type="password" id="reg-password" name="password" required 
               class="w-full bg-gray-950 border border-gray-800 focus:border-sky-500 text-white rounded-lg p-3 text-sm outline-none transition-colors">
      </div>
      <button type="submit" 
              class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-bold p-3 rounded-lg text-sm transition-colors mt-2">
        Create Account & Log In
      </button>
    </form>

    <!-- Footer Note -->
    <div class="mt-8 text-center text-xs text-gray-500 border-t border-gray-800/60 pt-6">
      Default Admin Login: <span class="text-sky-400 font-semibold">admin</span> / <span class="text-sky-400 font-semibold">admin123</span>
    </div>

  </div>

  <script>
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');

    tabLogin.addEventListener('click', () => {
      tabLogin.className = "flex-1 pb-3 text-sm font-semibold text-sky-400 border-b-2 border-sky-400 focus:outline-none";
      tabRegister.className = "flex-1 pb-3 text-sm font-semibold text-gray-400 border-b-2 border-transparent hover:text-gray-200 focus:outline-none";
      formLogin.classList.remove('hidden');
      formRegister.classList.add('hidden');
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.className = "flex-1 pb-3 text-sm font-semibold text-emerald-400 border-b-2 border-emerald-400 focus:outline-none";
      tabLogin.className = "flex-1 pb-3 text-sm font-semibold text-gray-400 border-b-2 border-transparent hover:text-gray-200 focus:outline-none";
      formRegister.classList.remove('hidden');
      formLogin.classList.add('hidden');
    });
  </script>
</body>
</html>
