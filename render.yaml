services:
  - type: web
    name: water-filtration-ml-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: STORAGE_DIR
        value: /opt/render/project/src/data-storage
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: filtration-storage
      mountPath: /opt/render/project/src/data-storage
      sizeGB: 1
