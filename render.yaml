services:
  - type: web
    name: water-filtration-ml-app
    plan: free
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: STORAGE_DIR
        value: .
      - key: PYTHON_VERSION
        value: 3.11.0
